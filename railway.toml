# Railway config-as-code
# ค่า env ตั้งใน Railway Dashboard > Variables (ไฟล์นี้เก็บเป็นเอกสารอ้างอิง)
#
#   DATABASE_PATH = /data/learning_assistant.db   (ต้องอยู่ใน Volume)
#   DISCORD_TOKEN = <secret>
#   TYPHOON_API_KEY = <secret>
#   DEBUG_MODE = False
#   GEMINI_API_KEY = <secret>   (ถ้าใช้ gemini_service.py)

[deploy]
# service เดียว: dashboard (background) + Discord bot (foreground) ดู start.sh
startCommand = "sh start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
